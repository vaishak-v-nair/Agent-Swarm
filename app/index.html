<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AgentSwarm</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="bar">
      <span class="brand">AgentSwarm</span>
      <span id="profiles"></span>
      <!-- The muster rail: one lamp per pane, in pane order. Nine sessions
           read in a glance instead of nine headers audited one at a time. -->
      <span id="muster" title="every pane, in order"></span>
      <span id="tally"></span>
      <span id="flash"></span>
      <span class="spacer"></span>
      <span id="hint"><b>ctrl+shift+P</b> everything &nbsp; M timeline &nbsp; D changes &nbsp; F search &nbsp; space jump</span>
    </header>
    <!-- Two layouts over the same panes. Grid tiles them evenly; stage gives
         the one you are reading the room and keeps the rest as live cards.
         Panes move between these containers — they are never rebuilt. -->
    <main id="board" data-layout="grid">
      <div id="grid"></div>
      <div id="rail"></div>
      <div id="stage"></div>
      <div id="empty"></div>
    </main>

    <!-- M4: one keystroke to everything. Recipes, panes, views, all findable
         by typing rather than by remembering another chord. -->
    <div id="palette">
      <div class="pal-box">
        <input id="pal-input" autocomplete="off" spellcheck="false">
        <div id="pal-list"></div>
      </div>
    </div>

    <!-- M4: the merged timeline — every session, in the order it happened.
         "It places everything in order which claude CLI lacks." -->
    <div id="timeline">
      <div class="tl-box">
        <div class="tl-head">
          <span class="tl-title">timeline</span>
          <span id="tl-scope"></span>
          <span class="spacer"></span>
          <span class="tl-close" title="close (esc)">✕</span>
        </div>
        <div id="tl-body"></div>
      </div>
    </div>
    <!-- M5: one frame for changes and for search. A second bespoke overlay
         would just be a third set of open/close bugs. -->
    <div id="sheet">
      <div class="sh-box">
        <div class="sh-head">
          <span class="sh-title" id="sh-title"></span>
          <span id="sh-sub"></span>
          <span class="spacer"></span>
          <span class="sh-close" title="close (esc)">✕</span>
        </div>
        <div id="sh-body"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
