<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AgentSwarm — harness</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!--
    A stand-in for Tauri so the real UI can be driven in a browser.

    This exists because four milestones shipped without anyone ever typing into
    the app. Every check was stdout diagnostics and unit tests, which verify that
    the parts work and say nothing about whether the thing responds to a key. The
    first key a human pressed found a bug.

    Nothing here mocks the UI — index.html's markup and src/main.js run
    unmodified. Only the IPC boundary is faked, and every call across it is
    recorded in window.__calls so a test can assert on exactly what the app tried
    to send to the PTY.
  -->
  <script>
    window.__calls = [];        // every invoke, in order
    window.__listeners = {};    // event name -> callback id

    const searchParams = new URLSearchParams(location.search);
    const CWD = searchParams.get('cwd') || (location.pathname.startsWith('/') ? location.origin : '.');

    let nextCb = 0;
    window.__TAURI_INTERNALS__ = {
      transformCallback(cb) {
        const id = ++nextCb;
        window['_' + id] = cb;
        return id;
      },
      async invoke(cmd, payload) {
        window.__calls.push({ cmd, payload });
        try {
          const res = await fetch('/api/bridge', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cmd, payload }),
          });
          if (res.ok) {
            const json = await res.json();
            if (json.ok && json.data !== null && json.data !== undefined) {
              return json.data;
            }
          }
        } catch {
          // Dev bridge unavailable, fall back to dynamic in-memory handling
        }

        switch (cmd) {
          case 'plugin:event|listen':
            window.__listeners[payload.event] = payload.handler;
            return Promise.resolve(nextCb);
          case 'plugin:event|unlisten':
            return Promise.resolve();
          case 'available_profiles':
            return Promise.resolve(['powershell', 'cmd', 'pwsh', 'claude']);
          case 'default_cwd':
            return Promise.resolve(CWD);
          case 'startup_swarm':
            return Promise.resolve(searchParams.get('swarm'));

          case 'git_changes':
            return Promise.resolve({
              root: CWD, branch: 'main', problem: '',
              files: searchParams.has('mock') ? [
                { path: 'app/src/main.js', status: ' M', added: 0, removed: 0, untracked: false },
              ] : [],
            });

          case 'git_file_diff':
            return Promise.resolve('');

          case 'search_history':
            return Promise.resolve([]);

          case 'file_history':
            return Promise.resolve([]);
          case 'load_settings':
            return Promise.resolve({
              settings: { quiet_ms: 2000, stuck_ms: 30000, burst_floor: 800,
                          scrollback: 10000, feed_max: 2000, restore_layout: true },
              source: 'defaults', problem: '',
            });
          case 'write_settings_template':
            return Promise.resolve('.agentswarm/settings.json');
          case 'save_layout':
            window.__savedLayout = payload.panes;
            return Promise.resolve(null);
          case 'load_layout':
            return Promise.resolve(searchParams.has('restore') ? [
              { profile: 'claude', cwd: CWD, label: 'restored-a', args: [] },
              { profile: 'powershell', cwd: CWD, label: 'restored-b', args: [] },
            ] : []);
          case 'seed_first_run':
            return Promise.resolve(searchParams.has('firstrun')
              ? CWD + '/.agentswarm/recipes.json' : null);
          case 'about':
            return Promise.resolve({
              version: '0.1.0',
              cwd: CWD,
              config_dir: CWD + '/.agentswarm',
              transcripts: '',
            });
          case 'clip_write':
            window.__clipboard = payload.text;
            return Promise.resolve(null);
          case 'clip_read':
            return Promise.resolve(window.__clipboard ?? 'from-clipboard');
          case 'open_url':
            window.__opened = (window.__opened || []).concat(payload.url);
            return Promise.resolve(null);
          case 'save_settings':
            window.__savedSettings = payload;
            return Promise.resolve(CWD + '/.agentswarm/settings.json');
          case 'list_recipes':
            return Promise.resolve({
              problems: [],
              recipes: [
                { name: 'morning', description: 'the daily two', panes: [
                  { profile: 'claude',     cwd: CWD, label: 'swarm', args: [] },
                  { profile: 'powershell', cwd: CWD, label: 'shell', args: [] }] },
                { name: 'review', description: 'a reviewer that cannot edit', panes: [
                  { profile: 'claude', cwd: CWD, label: 'reviewer',
                    args: ['--permission-mode', 'plan'] }] },
              ],
            });

          default:
            return Promise.resolve(null);
        }
      },
    };

    /** Push an event at the UI exactly as the Rust side would. */
    window.__emit = (event, payload) => {
      const id = window.__listeners[event];
      if (!id) return false;
      window['_' + id]({ event, id, payload });
      return true;
    };

    /** Everything the app tried to write to a PTY, as one string per pane. */
    window.__written = paneId => window.__calls
      .filter(c => c.cmd === 'pty_write' && (paneId == null || c.payload.id === paneId))
      .map(c => c.payload.data)
      .join('');

    /** Escape sequences are invisible in a diff; show them. */
    window.__visible = s => s
      .replace(/\x1b/g, '<ESC>').replace(/\r/g, '<CR>').replace(/\n/g, '<LF>')
      .replace(/\x7f/g, '<DEL>').replace(/\x03/g, '<C-c>');
  </script>

  <header id="bar">
    <span class="brand">AgentSwarm</span>
    <span id="profiles"></span>
    <span id="muster" title="every pane, in order"></span>
    <span id="tally"></span>
    <span id="flash"></span>
    <span class="spacer"></span>
    <span id="hint"><b>ctrl+shift+P</b> everything &nbsp; M timeline &nbsp; D changes &nbsp; F search &nbsp; space jump</span>
  </header>
  <main id="board" data-layout="grid">
    <div id="grid"></div>
    <div id="rail"></div>
    <div id="stage"></div>
    <div id="empty"></div>
  </main>

  <div id="palette">
    <div class="pal-box">
      <input id="pal-input" name="palette-query" autocomplete="off" spellcheck="false">
      <div id="pal-list"></div>
    </div>
  </div>

  <div id="timeline">
    <div class="tl-box">
      <div class="tl-head">
        <span class="tl-title">timeline</span>
        <span id="tl-scope"></span>
        <span class="spacer"></span>
        <span class="tl-close" title="close (esc)">✕</span>
      </div>
      <div id="tl-body"></div>
    </div>
  </div>

  <div id="sheet">
    <div class="sh-box">
      <div class="sh-head">
        <span class="sh-title" id="sh-title"></span>
        <span id="sh-sub"></span>
        <span class="spacer"></span>
        <span class="sh-close" title="close (esc)">✕</span>
      </div>
      <div id="sh-body"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
