[package]
name = "agentswarm"
version = "0.1.0"
description = "The terminal built for agentic coding"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "agentswarm"
path = "src/main.rs"

[lib]
name = "agentswarm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
anyhow = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
