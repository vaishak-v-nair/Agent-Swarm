<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Segoe UI Variable Display";
          src: local("Segoe UI Variable Display"), local("Segoe UI Semibold"), local("Segoe UI");
        }
        @font-face {
          font-family: "Segoe UI Variable Text";
          src: local("Segoe UI Variable Text"), local("Segoe UI");
        }
        @font-face {
          font-family: "Cascadia Mono";
          src: local("Cascadia Mono"), local("Cascadia Code"), local("Consolas");
        }

        #root {
          position: absolute;
          inset: 0;
          background: #141519;
          overflow: hidden;
          font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        }

        /* The bloom that opens the film. It is the amber lamp before you know
           it is a lamp — the same colour the fifth agent will turn. */
        #bloom {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 1500px;
          height: 1500px;
          margin: -750px 0 0 -750px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(217, 160, 91, 0.3), transparent 58%);
          opacity: 0;
          will-change: transform, opacity;
        }

        /* depth-scatter-assemble needs a real perspective stage. */
        #stage {
          position: absolute;
          inset: 0;
          perspective: 1600px;
          perspective-origin: 50% 46%;
        }
        #deck {
          position: absolute;
          left: 460px;
          top: 258px;
          width: 1000px;
          transform-style: preserve-3d;
          will-change: transform, filter;
        }

        /* Faithful to app/src/style.css .pane .head — same tokens, same grid. */
        .row {
          position: relative;
          display: flex;
          align-items: center;
          height: 96px;
          padding: 0 30px;
          margin-bottom: 14px;
          background: #1b1c21;
          border: 1px solid #282a30;
          border-radius: 10px;
          font-family: "Cascadia Mono", Consolas, ui-monospace, monospace;
          font-size: 27px;
          opacity: 0;
          transform-style: preserve-3d;
          will-change: transform, opacity;
        }
        .dot {
          width: 11px;
          height: 11px;
          border-radius: 50%;
          margin-right: 26px;
          flex: none;
          background: #6fae86;
        }
        .nm {
          color: #d8d6d1;
          width: 250px;
          flex: none;
        }
        .st {
          flex: 1;
          color: #6fae86;
        }
        .el {
          color: #8a8c93;
          font-variant-numeric: tabular-nums;
        }

        /* The one row that will ask for you. Its amber is set by the timeline,
           not by CSS, so the flip is a visible event rather than a fact. */
        #r3 .dot {
          background: #6fae86;
        }

        /* A ring that fires once on the flip. Finite, one pass, no pulse. */
        #ring {
          position: absolute;
          left: 8px;
          top: 50%;
          width: 30px;
          height: 30px;
          margin-top: -15px;
          border-radius: 50%;
          border: 2px solid #d9a05b;
          opacity: 0;
          will-change: transform, opacity;
        }

        /* Frame 02 lives in the same file so the rack-focus between the two
           beats is real depth, not a fake crossfade between two scenes. */
        #q {
          position: absolute;
          left: 220px;
          top: 452px;
          width: 1480px;
          font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
          font-weight: 600;
          font-size: 96px;
          line-height: 1.04;
          letter-spacing: -0.025em;
          color: #d9a05b;
          text-align: center;
        }
        .qw {
          display: inline-block;
          opacity: 0;
          will-change: transform;
        }
      </style>

      <div
        id="root"
        data-composition-id="cold-open"
        data-width="1920"
        data-height="1080"
        data-duration="9.8"
      >
        <div id="bloom"></div>

        <div id="stage">
          <div id="deck">
            <div class="row" id="r1">
              <span class="dot"></span><span class="nm">#1 claude</span
              ><span class="st">running</span><span class="el" id="t1">2m 14s</span>
            </div>
            <div class="row" id="r2">
              <span class="dot"></span><span class="nm">#2 claude</span
              ><span class="st">running</span><span class="el" id="t2">1m 02s</span>
            </div>
            <div class="row" id="r3">
              <span id="ring"></span><span class="dot"></span><span class="nm">#3 claude</span
              ><span class="st" id="s3">running</span><span class="el" id="t3">0m 41s</span>
            </div>
            <div class="row" id="r4">
              <span class="dot"></span><span class="nm">#4 claude</span
              ><span class="st">running</span><span class="el" id="t4">4m 41s</span>
            </div>
            <div class="row" id="r5">
              <span class="dot"></span><span class="nm">#5 shell</span
              ><span class="st">running</span><span class="el" id="t5">0m 55s</span>
            </div>
          </div>
        </div>

        <div id="q" data-layout-allow-overlap>
          <span class="qw" id="q1">Which</span> <span class="qw" id="q2">one</span>
          <span class="qw" id="q3">is</span> <span class="qw" id="q4">waiting</span>
          <span class="qw" id="q5">on</span> <span class="qw" id="q6">you?</span>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });

          // ---- ambient-glow-bloom: the film opens on light, not on a card ---
          tl.fromTo(
            "#bloom",
            { opacity: 0, scale: 0.55 },
            { opacity: 1, scale: 1, duration: 0.95, ease: "power2.out" },
            0,
          );
          tl.to("#bloom", { opacity: 0.34, duration: 1.4, ease: "power1.inOut" }, 0.95);

          // ---- depth-scatter-assemble --------------------------------------
          // Index-derived offsets, never Math.random. Each row flies in from
          // its own point in depth and settles flat.
          var rows = ["#r1", "#r2", "#r3", "#r4", "#r5"];
          rows.forEach(function (id, i) {
            var at = 0.35 + i * 0.085;
            var dir = i % 2 === 0 ? 1 : -1;
            tl.fromTo(
              id,
              {
                opacity: 0,
                z: -560 - i * 90,
                y: 54 + i * 8,
                rotationX: 26 * dir,
                rotationY: -12 * dir,
              },
              {
                opacity: 1,
                z: 0,
                y: 0,
                rotationX: 0,
                rotationY: 0,
                duration: 0.58,
                ease: "power3.out",
              },
              at,
            );
          });

          // ---- counting-dynamic-scale: the timers are alive ----------------
          // A pure function of timeline time, so every seek agrees.
          var timers = [
            { el: "#t1", base: 134 },
            { el: "#t2", base: 62 },
            { el: "#t3", base: 41 },
            { el: "#t4", base: 281 },
            { el: "#t5", base: 55 },
          ];
          var nodes = timers.map(function (t) {
            return document.getElementById(t.el.slice(1));
          });
          function fmt(s) {
            var m = Math.floor(s / 60);
            var r = Math.floor(s % 60);
            return m + "m " + (r < 10 ? "0" : "") + r + "s";
          }
          var clock = { t: 0 };
          tl.to(
            clock,
            {
              t: 9.8,
              duration: 9.8,
              ease: "none",
              onUpdate: function () {
                for (var i = 0; i < timers.length; i++) {
                  // #3 stops counting the moment it starts waiting on you.
                  var frozen = i === 2 && clock.t > 2.45;
                  var add = frozen ? 2.45 : clock.t;
                  nodes[i].textContent = fmt(timers[i].base + add);
                }
              },
            },
            0,
          );

          // ---- the flip: #3 stops running and starts asking ----------------
          tl.to("#r3 .dot", { backgroundColor: "#d9a05b", duration: 0.16 }, 2.45);
          tl.to("#s3", { color: "#d9a05b", duration: 0.16 }, 2.45);
          tl.to("#r3", { backgroundColor: "#221d16", borderColor: "#4a3d2c", duration: 0.3 }, 2.45);
          // The app writes this state as literal text, so the film does too.
          tl.call(
            function () {
              document.getElementById("s3").textContent = "waiting on you";
            },
            null,
            2.45,
          );
          // spring-pop-entrance, restrained: one assertion.
          tl.fromTo(
            "#r3",
            { scale: 1 },
            { scale: 1.035, duration: 0.42, ease: "back.out(2.2)" },
            2.45,
          );
          tl.to("#r3", { scale: 1, duration: 0.5, ease: "power2.out", overwrite: "auto" }, 3.02);
          // One ring, one pass, then gone. Never a loop (frame.md).
          tl.fromTo(
            "#ring",
            { opacity: 0.9, scale: 0.5 },
            { opacity: 0, scale: 2.6, duration: 0.85, ease: "power2.out" },
            2.47,
          );

          // ---- the seam into frame 02: a real rack focus -------------------
          // The deck recedes and blurs; the question arrives in the near plane.
          tl.to(
            "#deck",
            { filter: "blur(9px)", opacity: 0.35, scale: 0.94, duration: 0.7, ease: "power2.inOut" },
            4.55,
          );
          tl.to("#bloom", { opacity: 0.18, duration: 0.7, ease: "power1.inOut" }, 4.55);

          // ---- kinetic-beat-slam: the question, word by word ---------------
          // Distinct entrances, not one cascade — the v1 note this fixes.
          var slam = [
            ["#q1", { y: 60, scale: 1.18 }, 0.0],
            ["#q2", { y: -46, scale: 0.86 }, 0.1],
            ["#q3", { y: 40, scale: 1.1 }, 0.19],
            ["#q4", { y: 70, scale: 1.24 }, 0.28],
            ["#q5", { y: -38, scale: 0.9 }, 0.4],
            ["#q6", { y: 78, scale: 1.3 }, 0.48],
          ];
          slam.forEach(function (s) {
            var at = 5.25 + s[2];
            tl.set(s[0], { opacity: 1 }, at);
            tl.fromTo(
              s[0],
              { y: s[1].y, scale: s[1].scale },
              { y: 0, scale: 1, duration: 0.34, ease: "power4.out" },
              at,
            );
          });

          window.__timelines["cold-open"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
