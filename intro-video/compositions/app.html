      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });

          /* Camera. Nested wrappers: #cam scales, #pan counter-translates, so
             the counter-translate is T = -offset and does not depend on scale
             (coordinate-target-zoom). Targets are canvas coordinates, which we
             own outright now that the UI is ours. */
          function look(at, dur, cx, cy, from, to, ease) {
            tl.to("#cam", { scale: to, duration: dur, ease: ease || "power3.inOut" }, at);
            tl.to(
              "#pan",
              { x: -(cx - 960), y: -(cy - 540), duration: dur, ease: ease || "power3.inOut" },
              at,
            );
            if (from != null) tl.set("#cam", { scale: from }, at);
          }
          function place(cx, cy, s) {
            tl.set("#cam", { scale: s }, 0);
            tl.set("#pan", { x: -(cx - 960), y: -(cy - 540) }, 0);
          }

          // Open already pushed in, continuing the wordmark's zoom-through.
          place(960, 540, 1.3);

          /* ===== P1 — the cockpit (0 → 6.5) ============================== */
          // 3d-camera-flight: the window arrives tilted and flattens.
          tl.fromTo(
            "#win",
            { opacity: 0, rotationX: 15, rotationY: -13, z: -420, y: 60 },
            {
              opacity: 1,
              rotationX: 0,
              rotationY: 0,
              z: 0,
              y: 0,
              duration: 1.0,
              ease: "power3.out",
            },
            0,
          );
          tl.to("#cam", { scale: 1, duration: 1.0, ease: "power3.out" }, 0);

          // Rail slides in, then the pane.
          tl.fromTo("#rail", { opacity: 0, x: -70 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.55);
          ["#rc1", "#rc2", "#rc3"].forEach(function (id, i) {
            tl.fromTo(
              id,
              { opacity: 0, x: -40 },
              { opacity: 1, x: 0, duration: 0.42, ease: "power4.out" },
              0.62 + i * 0.085,
            );
          });
          tl.fromTo("#pane", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.52, ease: "power3.out" }, 0.8);

          // The muster lamps light one at a time — the product's real answer
          // to "which one". Four green, then the amber one.
          var lamps = ["#lp1", "#lp2", "#lp3", "#lp4", "#lp5"];
          lamps.forEach(function (id, i) {
            var at = 1.3 + i * 0.115;
            tl.fromTo(
              id,
              { opacity: 0, scale: 0.3 },
              { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" },
              at,
            );
            tl.set(id, { backgroundColor: i === 4 ? "#d9a05b" : "#6fae86" }, at);
          });

          // Terminal history is already there; the session did not start now.
          ["#tl1", "#tl2", "#tl3", "#tl4", "#tl5", "#tl6", "#tl7"].forEach(function (id, i) {
            tl.set(id, { opacity: 0.45 }, 1.05 + i * 0.035);
          });

          /* ===== P2 — send work (6.5 → 13.0) ============================= */
          look(4.5, 0.85, 900, 420, null, 1.42);
          // depth-of-field-blur: everything that is not the pane recedes.
          tl.to("#rail", { filter: "blur(4px)", opacity: 0.45, duration: 0.6 }, 4.6);

          // Cursor arrives and clicks into the pane (cursor-click-ripple).
          tl.set("#cur", { x: 1500, y: 900, opacity: 0 }, 4.5);
          tl.to("#cur", { opacity: 1, duration: 0.2 }, 4.65);
          tl.to("#cur", { x: 700, y: 250, duration: 0.62, ease: "power2.inOut" }, 4.7);
          tl.set("#ripple", { x: 700, y: 250 }, 5.35);
          tl.fromTo(
            "#ripple",
            { opacity: 0.85, scale: 0.3 },
            { opacity: 0, scale: 2.2, duration: 0.5, ease: "power2.out" },
            5.35,
          );
          tl.to("#cur", { opacity: 0, duration: 0.22 }, 5.6);

          // The command types. Smooth slice — the instrument does not fumble.
          tl.set("#tl0", { opacity: 1 }, 5.5);
          var CMD = "git log --oneline -5";
          var typed = document.getElementById("typed");
          var len = { v: 0 };
          tl.to(
            len,
            {
              v: CMD.length,
              duration: 0.85,
              ease: "none",
              onUpdate: function () {
                typed.textContent = CMD.substring(0, Math.floor(len.v));
              },
            },
            5.55,
          );
          // Caret blink: deterministic square wave off the timeline clock.
          var caret = document.getElementById("caret");
          var blink = { p: 0 };
          tl.to(
            blink,
            {
              p: Math.PI * 2 * 30,
              duration: 16,
              ease: "none",
              onUpdate: function () {
                caret.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
              },
            },
            5.3,
          );

          // Output lands as a wave, brightening the history behind it.
          ["#tl1","#tl2","#tl3","#tl4","#tl5","#tl6","#tl7","#tl8","#tl9","#tl10","#tl11","#tl12","#tl13"].forEach(function (id, i) {
            var at = 6.6 + i * 0.055;
            tl.set(id, { opacity: 1, y: 16 }, at);
            tl.to(id, { y: 0, duration: 0.2, ease: "power4.out" }, at);
          });

          // The callout lands ON the output, with a leader line to its label.
          var lp = document.getElementById("lead-path");
          tl.set("#spot", { left: 330, top: 130, width: 700, height: 250 }, 7.5);
          tl.fromTo(
            "#spot",
            { opacity: 0, scale: 1.06 },
            { opacity: 1, scale: 1, duration: 0.36, ease: "power3.out" },
            7.5,
          );
          tl.set(lp, { attr: { d: "M1030 200 H1210" } }, 7.5);
          lp.style.strokeDasharray = 180;
          lp.style.strokeDashoffset = 180;
          tl.to(lp, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 7.72);
          tl.set("#label", { left: 1216, top: 176 }, 7.9);
          document.getElementById("label").textContent = "no keyboard";
          tl.fromTo(
            "#label",
            { opacity: 0, x: -18 },
            { opacity: 1, x: 0, duration: 0.26, ease: "power4.out" },
            7.9,
          );
          tl.to(["#spot", "#label"], { opacity: 0, duration: 0.3 }, 9.6);
          tl.to(lp, { strokeDashoffset: 180, duration: 0.26 }, 9.6);

          /* ===== P3 — plain english (13.0 → 19.5) ======================== */
          // theme-crossfade-morph under a fixed anchor: the pane header never
          // moves, so the two readings are the same session, not two screens.
          tl.to("#mode", { color: "#7f9dc0", borderColor: "#7f9dc0", duration: 0.22 }, 10.2);
          tl.fromTo("#mode", { scale: 1 }, { scale: 1.1, duration: 0.18, ease: "back.out(3)" }, 10.2);
          tl.to("#mode", { scale: 1, duration: 0.22, overwrite: "auto" }, 10.4);
          tl.call(
            function () {
              document.getElementById("mode").textContent = "plain english";
            },
            null,
            10.3,
          );

          tl.to("#term", { opacity: 0, duration: 0.38, ease: "power2.inOut" }, 10.3);
          tl.set("#flow", { opacity: 1 }, 10.55);
          ["#cd1", "#cd2", "#cd3", "#cd4"].forEach(function (id, i) {
            var at = 10.7 + i * 0.17;
            tl.fromTo(
              id,
              { opacity: 0, y: 30 },
              { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
              at,
            );
          });
          // A slow push while it is read — motivated, monotonic, not a loop.
          look(11.2, 3.0, 960, 430, null, 1.3, "none");

          /* ===== P4 — the palette (19.5 → 24.5) ========================== */
          look(15.2, 0.7, 960, 525, null, 1.7);
          tl.to("#flow", { opacity: 0.25, filter: "blur(5px)", duration: 0.4 }, 15.3);
          tl.to("#scrim", { opacity: 1, duration: 0.32 }, 15.3);
          tl.to("#rail", { opacity: 0.2, duration: 0.32, overwrite: "auto" }, 15.3);

          // anchored-layout-expand: a pill springs open into the panel.
          tl.fromTo(
            "#palette",
            { opacity: 0, scaleY: 0.12, scaleX: 0.55, y: -10 },
            { opacity: 1, scaleY: 1, scaleX: 1, y: 0, duration: 0.42, ease: "back.out(1.5)" },
            15.5,
          );
          ["#pr1", "#pr2", "#pr3", "#pr4", "#pr5", "#pr6"].forEach(function (id, i) {
            var at = 15.75 + i * 0.05;
            tl.set(id, { opacity: 1, y: 14 }, at);
            tl.to(id, { y: 0, duration: 0.22, ease: "power4.out" }, at);
          });
          // Selection steps down the list — the keyboard driving, not a mouse.
          tl.set("#pr1", { backgroundColor: "#1b1c21" }, 16.7);
          tl.set("#pr4", { backgroundColor: "#212228" }, 16.7);
          tl.set("#pr4", { backgroundColor: "#1b1c21" }, 17.3);
          tl.set("#pr5", { backgroundColor: "#212228" }, 17.3);

          /* ===== P5 — the timeline (24.5 → 29.5) ========================= */
          tl.to(
            "#palette",
            { opacity: 0, scaleY: 0.2, y: -14, duration: 0.3, ease: "power2.in" },
            18.6,
          );
          look(18.8, 0.72, 960, 560, null, 1.28);
          tl.fromTo(
            "#sheet",
            { opacity: 0, y: 220 },
            { opacity: 1, y: 0, duration: 0.52, ease: "power3.out" },
            18.85,
          );
          var srows = ["#sr1", "#sr2", "#sr3", "#sr4", "#sr5", "#sr6", "#sr7", "#sr8"];
          srows.forEach(function (id, i) {
            var at = 19.2 + i * 0.055;
            tl.set(id, { opacity: 1, y: 18 }, at);
            tl.to(id, { y: 0, duration: 0.24, ease: "power4.out" }, at);
          });
          // nudge-curve: the sheet scrolls once, slow-fast-slow.
          tl.to("#srows", { y: -110, duration: 1.3, ease: "power2.inOut" }, 19.9);

          // Exit: pull back out of the window for the diagram that follows.
          tl.to("#cam", { scale: 0.86, duration: 0.85, ease: "power2.inOut" }, 21.1);
          tl.to("#win", { opacity: 0, duration: 0.6, ease: "power2.in" }, 21.35);
          tl.to("#scrim", { opacity: 0, duration: 0.42 }, 21.2);

          window.__timelines["app"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
